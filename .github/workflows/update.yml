name: Update map

on:
  schedule:
    # Every 5 minutes across US market hours (covers summer and winter time), then once after the close.
    # GitHub runs these on a best-effort basis, so a run can start several minutes late.
    - cron: "*/5 13-21 * * 1-5"
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Today's date (for the daily cache)
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Long-range history cache (rebuilt once a day)
        uses: actions/cache@v4
        with:
          path: anchors.json
          key: anchors-${{ steps.day.outputs.d }}
      - name: Fundamentals cache (kept between runs, topped up a little each time)
        uses: actions/cache@v4
        with:
          path: fund-cache.json
          key: fund-${{ github.run_id }}
          restore-keys: fund-
      - name: Fetch data
        run: python fetch.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Let the uploaded page settle before deploying
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy again if the first try missed the artifact
        if: steps.deploy.outcome == 'failure'
        run: sleep 40
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
